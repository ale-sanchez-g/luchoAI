name: CI

on:
  push:
    branches: [main, 'claude/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          echo "implement your step: run your package manager install here (e.g. npm ci)"

      - name: Run linter
        run: |
          echo "implement your step: run your linter here (e.g. npm run lint)"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          echo "implement your step: run your package manager install here (e.g. npm ci)"

      - name: Run tests with coverage
        run: |
          echo "implement your step: run your test suite here (e.g. npm test -- --coverage --ci)"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          echo "implement your step: run your package manager install here (e.g. npm ci)"

      - name: Build
        run: |
          echo "implement your step: run your build command here (e.g. npm run build)"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit dependencies
        run: |
          echo "implement your step: run your dependency audit here (e.g. npm audit --audit-level=high)"

      - name: Scan for hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets..."
          if grep -rE '(password|secret|api_key|apikey|token)\s*=\s*["'"'"'\`][^"'"'"'\`]{8,}' \
            --include='*.ts' --include='*.js' --include='*.json' \
            --exclude-dir=node_modules --exclude-dir=.git \
            . ; then
            echo "ERROR: Possible hardcoded secret detected."
            exit 1
          fi
          echo "No secrets found."

  validate-claude-config:
    name: Validate Claude Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check CLAUDE.md exists
        run: |
          test -f CLAUDE.md && echo "CLAUDE.md present" || (echo "ERROR: CLAUDE.md missing" && exit 1)

      - name: Validate .mcp.json is valid JSON
        run: |
          python3 -c "import json, sys; json.load(open('.mcp.json'))" && \
            echo ".mcp.json is valid JSON" || \
            (echo "ERROR: .mcp.json is not valid JSON" && exit 1)

      - name: Validate .claude/settings.json is valid JSON
        run: |
          python3 -c "import json, sys; json.load(open('.claude/settings.json'))" && \
            echo ".claude/settings.json is valid JSON" || \
            (echo "ERROR: .claude/settings.json is not valid JSON" && exit 1)

      - name: Validate hook scripts are executable syntax
        run: |
          for script in .claude/hooks/*.sh; do
            bash -n "$script" && echo "$script syntax OK" || (echo "ERROR: $script has syntax errors" && exit 1)
          done
