name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /luchoAI

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Scan for hardcoded API keys
        run: |
          if grep -rE 'sk-ant-[a-zA-Z0-9_-]{20,}' --include='*.ts' --include='*.tsx' --include='*.js' --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "ERROR: Hardcoded Anthropic API key detected"
            exit 1
          fi
          if grep -rE '"sk-[a-zA-Z0-9_-]{40,}"' --include='*.ts' --include='*.tsx' --include='*.js' --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "ERROR: Hardcoded OpenAI API key detected"
            exit 1
          fi
          if grep -rE '"hf_[a-zA-Z0-9_-]{20,}"' --include='*.ts' --include='*.tsx' --include='*.js' --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "ERROR: Hardcoded Hugging Face token detected"
            exit 1
          fi
          echo "No hardcoded secrets found"

  validate-config:
    name: Validate Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check CLAUDE.md exists
        run: |
          test -f CLAUDE.md && echo "CLAUDE.md present" || (echo "ERROR: CLAUDE.md missing" && exit 1)

      - name: Validate JSON config files
        run: |
          python3 -m json.tool .mcp.json > /dev/null && echo ".mcp.json valid"
          python3 -m json.tool .claude/settings.json > /dev/null && echo "settings.json valid"
