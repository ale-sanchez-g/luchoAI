name: CI

on:
  push:
    branches: [main, 'claude/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /luchoAI

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Scan for hardcoded API keys
        run: |
          if grep -rE 'sk-ant-[a-zA-Z0-9\-]{20,}' \
            --include='*.ts' --include='*.tsx' --include='*.js' \
            --exclude-dir=node_modules --exclude-dir=.git \
            . ; then
            echo "ERROR: Possible hardcoded Anthropic API key detected."
            exit 1
          fi
          echo "No hardcoded secrets found."

  validate-config:
    name: Validate Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check CLAUDE.md exists
        run: test -f CLAUDE.md && echo "CLAUDE.md present" || (echo "ERROR: CLAUDE.md missing" && exit 1)

      - name: Validate .mcp.json
        run: python3 -c "import json; json.load(open('.mcp.json'))" && echo ".mcp.json valid"

      - name: Validate Claude settings
        run: python3 -c "import json; json.load(open('.claude/settings.json'))" && echo "settings.json valid"
